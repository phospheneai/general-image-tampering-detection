# Smoke test the whole pipeline on AWS: ECR pull -> FastFile mount -> MDS read
# -> fwd/bwd -> checkpoint -> S3 sync, on the smoke/ slice for 1 epoch
# (~10-15 min, well under $1 on ml.g6e.2xlarge, on-demand).
#
# Calls aws-sagemaker/launch.py directly, same as Run training. Unlike Run
# training it waits: the SageMaker SDK streams the job's log here and fails
# this workflow if the job fails — a real red/green check before you commit
# to a multi-day run.
#
# Needs (see aws-sagemaker/README.md, One-time setup):
#   s3://authenta-data-rnd/image-tampering-detection/smoke/{train,test}/index.json
#   s3://authenta-data-rnd/image-tampering-detection/artifacts/dinov3-vitl16/model.safetensors
name: Smoke test

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR tag to test. Blank = whichever image was pushed most recently."
        required: false
        default: ""

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: forgery-train
  DATA: s3://authenta-data-rnd/image-tampering-detection

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75        # the job itself is capped at 1 h (--max-run-hours 1)
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the smoke data and backbone exist
        run: |
          set -euo pipefail
          fail=0
          need () {               # s3-uri  how-to-fix
            # capture the listing on its own so an AccessDenied is reported as
            # such, instead of being mistaken for a missing file
            local out
            if out=$(aws s3 ls "$1" 2>&1); then
              echo "found $1"
            elif grep -q "AccessDenied" <<<"$out"; then
              echo "::error::cannot list $1 — the GitHub role needs s3:ListBucket (aws-infra/iam/github-policy.json)"; fail=1
            else
              echo "::error::missing $1 — $2"; fail=1
            fi
          }
          need "$DATA/smoke/train/index.json" "run: python scripts/make_smoke_mds.py --upload"
          need "$DATA/smoke/test/index.json"  "run: python scripts/make_smoke_mds.py --upload"
          need "$DATA/artifacts/dinov3-vitl16/model.safetensors" "upload the DINOv3 backbone (aws-sagemaker/README.md)"
          exit $fail

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet "sagemaker>=2.240,<3" boto3 pyyaml

      - name: Run the smoke job
        id: run
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_ROLE_ARN }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          if [ -z "$IMAGE_TAG" ]; then
            # blank -> whatever was pushed most recently, by push time, not
            # the :latest tag (that only moves on a default-branch build)
            IMAGE_TAG=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" \
              --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' --output text)
            if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "None" ]; then
              echo "::error::no images in $ECR_REPOSITORY — run 'Build training image' first"
              exit 1
            fi
            echo "no image tag given — using the most recently pushed: $IMAGE_TAG"
          fi
          IMAGE="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # fail now, not 10 minutes into provisioning, if the tag isn't there
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" --region "$AWS_REGION" >/dev/null

          # the job runs as our own SageMaker role (aws-infra/setup-aws.sh);
          # a SAGEMAKER_ROLE_ARN repository secret overrides it
          SAGEMAKER_ROLE="${SAGEMAKER_ROLE_ARN:-arn:aws:iam::${ACCOUNT}:role/forgery-sagemaker-role}"
          export SAGEMAKER_ROLE

          JOB="smoke-$(date -u +%Y%m%d-%H%M%S)"
          {
            echo "job=$JOB"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"

          # no --no-wait: blocks here and raises (failing this workflow) if
          # the SageMaker job fails — that's the whole point of a smoke test
          python aws-sagemaker/launch.py \
            --config config/smoke.yml \
            --image-uri "$IMAGE" \
            --run-name "$JOB" \
            --end-epoch 1 --max-run-hours 1 --volume-size 50 --no-spot

      - name: Report
        if: always() && steps.run.outputs.job != ''
        env:
          JOB: ${{ steps.run.outputs.job }}
          IMAGE: ${{ steps.run.outputs.image }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          STATUS=$(aws sagemaker describe-training-job --training-job-name "$JOB" \
                     --query TrainingJobStatus --output text 2>/dev/null || echo "did not start")
          {
            echo "### Smoke test: ${STATUS}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}\` |"
            echo "| job | \`${JOB}\` |"
            echo "| logs | \`/aws/sagemaker/TrainingJobs/${JOB}\` |"
            echo "| checkpoints | \`${DATA}/sagemaker/smoke/checkpoints/${JOB}/\` |"
            echo ""
            echo "Final metrics:"
            echo '```'
            aws sagemaker describe-training-job --training-job-name "$JOB" \
              --query 'FinalMetricDataList[].[MetricName,Value]' --output text 2>/dev/null || echo "(none)"
            echo '```'
            if [ "$OUTCOME" != "success" ]; then
              echo "Failure reason:"
              echo '```'
              aws sagemaker describe-training-job --training-job-name "$JOB" \
                --query FailureReason --output text 2>/dev/null | head -40 || echo "(unavailable)"
              echo '```'
              echo "Last log lines:"
              echo '```'
              aws logs filter-log-events --log-group-name /aws/sagemaker/TrainingJobs \
                --log-stream-name-prefix "$JOB/" --query 'events[-60:].message' --output text 2>/dev/null \
                | tr '\t' '\n' | tail -60 || echo "(unavailable)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
